[package]
name = "fusor-navigation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
browser-tests = []

[dependencies]
fusor-components = { workspace = true, features = ["browser"] }
fusor-core = { workspace = true, features = ["dom"] }
fusor-async = { workspace = true, features = ["browser"] }
fusor-router = { workspace = true, features = ["browser"] }
wasm-bindgen.workspace = true

[build-dependencies]
fusor-build.workspace = true

[package.metadata.fusor]
entry = "web/index.html"
assets = { "/" = "public" }
output = "dist"
base-path = "/reader/"
history-fallback = ["/articles", "/missing"]

[package.metadata.fusor.components]
pages = "web/pages.html"
