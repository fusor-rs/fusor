[package]
name = "fusor-playground"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.fusor]
entry = "web/index.html"
assets = { "/" = "public" }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fusor-components = { workspace = true, features = ["browser"] }
fusor-core = { workspace = true, features = ["dom"] }
wasm-bindgen.workspace = true
web-sys.workspace = true

[build-dependencies]
fusor-build.workspace = true

[lints]
workspace = true
