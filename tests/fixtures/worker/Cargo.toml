[package]
name = "fusor-worker-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
[workspace]
[lib]
crate-type = ["cdylib", "rlib"]
[features]
pool = ["dep:rayon"]
[dependencies]
rayon = { version = "=1.11.0", optional = true }
worker_tasks = { package = "worker-test-dependency", path = "dependency" }
fusor-core = { path = "../../../crates/fusor-core", features = ["javascript"] }
fusor-components = { path = "../../../crates/fusor-components", features = ["browser"] }
fusor-worker = { path = "../../../crates/fusor-worker" }
fusor-async = { path = "../../../crates/fusor-async", features = ["browser"] }
wasm-bindgen = "=0.2.117"
wasm-bindgen-futures = "=0.4.67"
serde = { version = "1", features = ["derive"] }
js-sys = "=0.3.94"
[build-dependencies]
fusor-build = { path = "../../../crates/fusor-build" }
[package.metadata.fusor]
entry = "web/index.html"
base-path = "/workers/"
assets = "public"
[profile.release]
lto = true
codegen-units = 1
[lints.rust]
unsafe_code = "forbid"
