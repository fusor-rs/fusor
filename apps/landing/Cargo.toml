[package]
name = "fusor-landing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fusor-core = { path = "../../crates/fusor-core", features = ["dom"] }
fusor-components = { path = "../../crates/fusor-components", features = ["browser"] }
fusor-async = { path = "../../crates/fusor-async", features = ["browser"] }
gloo-timers = { version = "=0.3.0", features = ["futures"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Navigator", "Clipboard"] }

[build-dependencies]
fusor-build = { path = "../../crates/fusor-build" }
syntect = { version = "=5.3.0", default-features = false, features = ["default-themes", "regex-fancy"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }

[package.metadata.fusor]
base-path = "/"

# The .txt suffix makes browsers display published source instead of running it.
[package.metadata.fusor.assets]
"/" = "public"
"/install.sh" = "../../install.sh"
"/install.ps1" = "../../install.ps1"
"/source/src/" = { files = "src/*.rs", suffix = ".txt" }
"/source/web/components/" = { files = "web/components/*.html", suffix = ".txt" }
"/source/host/" = { files = ["host/*/src/app.rs", "host/*/web/index.html"], suffix = ".txt" }
