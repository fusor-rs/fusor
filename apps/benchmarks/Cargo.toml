[package]
name = "fusor-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
fusor-components = { workspace = true, features = ["browser"] }
fusor-core = { workspace = true, features = ["dom"] }
fusor-async = { workspace = true, features = ["browser"] }
wasm-bindgen.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[build-dependencies]
fusor-build.workspace = true
[package.metadata.fusor]
entry = "web/index.html"
assets = { "/" = "public" }
# Copies the published benchmark record into public/ before each build.
assets-build = ["node", "../../benchmarks/tools/cli.mjs", "site"]
base-path = "/benchmarks/"
