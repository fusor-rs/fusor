<script
  type="text/rust"
  src="../src/article.rs"
  rust:module="crate::article"
></script>
<template rust:component="Article">
  <div class="article-layout">
    <article class="article" id="main-content" tabindex="-1">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a data-fusor-link href="/docs/">Docs</a><span>/</span>
        <span>{{ state.page.group }}</span>
        <span><ForEach items="{{ state.breadcrumbs() }}" key="{{ |item| item.href }}">
<Breadcrumb item="{{ item.clone() }}"></Breadcrumb>
</ForEach></span>
      </nav>
      <h1>{{ state.page.title }}</h1>
      <div class="lead"><Prose paragraphs="{{ state.page.lead_prose }}"></Prose></div>
      <details class="mobile-toc">
        <summary>On this page</summary>
        <ul
        ><ForEach items="{{ state.sections() }}" key="{{ |item| item.id }}">
<Toc item="{{ item.clone() }}"></Toc>
</ForEach></ul>
      </details>
      <div class="welcome-grid" hidden="{{ state.index != 0 }}">
        <a data-fusor-link href="/docs/installation"
          ><span class="card-icon">↗</span><strong>Build your first app</strong
          ><span>From a Cargo package to a reactive page.</span></a
        >
        <a data-fusor-link href="/docs/html-and-rust"
          ><span class="card-icon">&lt;/&gt;</span
          ><strong>Learn the authoring model</strong
          ><span>Familiar HTML. Ordinary, checked Rust.</span></a
        >
      </div>
      <p class="welcome-showcase" hidden="{{ state.index != 0 }}">
        <a class="text-link" data-fusor-link href="/docs/showcase"
          >Explore live examples in the showcase →</a
        >
      </p>
      <div class="release-note" hidden="{{ state.index != 0 }}">
        <span class="note-icon">i</span>
        <div>
          <strong>An early, working foundation.</strong> fusor is
          pre-release. APIs can change; the examples and contracts here describe
          this checkout.
        </div>
      </div>
      <div
        class="sections"
      ><ForEach items="{{ state.sections() }}" key="{{ |item| item.id }}">
<Section item="{{ item.clone() }}"></Section>
</ForEach></div>
      <section
        class="live-demo"
        hidden='{{ state.index != 0 &amp;&amp; state.page.slug != "reactivity" }}'
      >
        <div>
          <span class="eyebrow">RUNNING IN RUST</span>
          <h2>A little less ceremony.</h2>
          <p>This counter is a Rust signal bound to these HTML elements.</p>
        </div>
        <div class="counter">
          <button
            aria-label="Decrease count"
            on:click="state.count.update(|n| *n -= 1)"
          >
            −</button
          ><output aria-live="polite">{{ state.count.get() }}</output
          ><button
            aria-label="Increase count"
            on:click="state.count.update(|n| *n += 1)"
          >
            +
          </button>
        </div>
      </section>
      <div class="article-footer">
        <span>Built with fusor · v0.1.0-dev</span
        ><a data-fusor-link href="/docs/tooling">Contributor workflow →</a>
      </div>
      <nav class="pagination" aria-label="Adjacent pages">
        <a
          data-fusor-link
          hidden="{{ state.index == 0 }}"
          href="{{ href(state.previous()) }}"
          ><small>← Previous</small
          ><strong>{{ PAGES[state.previous()].title }}</strong></a
        >
        <a
          data-fusor-link
          hidden="{{ state.index.saturating_add(1) >= PAGES.len() }}"
          href="{{ href(state.next()) }}"
          ><small>Next →</small
          ><strong>{{ PAGES[state.next()].title }}</strong></a
        >
      </nav>
    </article>
    <aside class="toc" aria-label="On this page">
      <h2>On this page</h2>
      <ul
      ><ForEach items="{{ state.sections() }}" key="{{ |item| item.id }}">
<Toc item="{{ item.clone() }}"></Toc>
</ForEach></ul>
      <div class="toc-note">HTML you can read.<br />Rust you can trust.</div>
    </aside>
  </div>
</template>
<template rust:component="Section">
  <section
    class="doc-section"
    class:api-entry="!state.item.get().api.is_empty()"
    id="{{ state.item.get().id }}"
  >
    <div class="api-badges"
    ><ForEach items="{{ state.item.get().api.to_vec() }}" key="{{ |api| api.kind }}" item="api">
<span class="api-badge-row"><span class="api-kind" data-kind="{{ api.get().kind }}">{{ api.get().kind }}</span
><span class="api-side" data-side="{{ api.get().side }}">{{ api.get().side_label }}</span></span>
</ForEach></div>
    <h2>
      <a href="#{{ state.item.get().id }}"
        >{{ state.item.get().title }}<span aria-hidden="true">#</span></a
      >
    </h2>
    <div class="body-copy"><Prose paragraphs="{{ state.item.get().body_prose }}"></Prose></div>
    <div class="api-from-list"
    ><ForEach items="{{ state.item.get().api.to_vec() }}" key="{{ |api| api.kind }}" item="api">
<div class="api-from" hidden="{{ api.get().from.is_empty() }}"><span class="api-label">Where you get one</span><Prose paragraphs="{{ api.get().from }}"></Prose></div>
</ForEach></div>
    <div class="section-code"
    ><CodeBlock data="{{ CodeData { label: state.item.get().language, tokens: state.item.get().tokens } }}"
      rust:if="!state.item.get().code.is_empty()"></CodeBlock></div>
    <div class="callouts"
    ><ForEach items="{{ state.item.get().callouts.to_vec() }}" key="{{ |callout| callout.id }}" item="callout">
<Callout item="{{ callout.clone() }}"></Callout>
</ForEach></div>
    <Terms items="{{ state.item.get().terms }}"></Terms>
    <div class="type-map"
    ><ForEach items="{{ state.item.get().map.to_vec() }}" key="{{ |group| group.id }}" item="group">
<MapGroup item="{{ group.clone() }}"></MapGroup>
</ForEach></div>
    <div class="api-body-list"
    ><ForEach items="{{ state.item.get().api.to_vec() }}" key="{{ |api| api.kind }}" item="api">
<ApiBody item="{{ api.clone() }}"></ApiBody>
</ForEach></div>
    <div class="note" hidden="{{ state.item.get().note.is_empty() }}">
      <Prose paragraphs="{{ state.item.get().note_prose }}"></Prose>
    </div>
    <details class="api-references" hidden="{{ state.item.get().references.is_empty() }}">
      <summary>In this example ({{ state.item.get().references.len() }})</summary>
      <ul class="related-links" aria-label="API and syntax references"><ForEach items="{{ state.item.get().references.to_vec() }}" key="{{ |item| item.href }}">
<RelatedLink item="{{ item.clone() }}"></RelatedLink>
</ForEach></ul>
    </details>
    <ul
      class="related-links"
      aria-label="Related guidance"
    ><ForEach items="{{ state.item.get().links.to_vec() }}" key="{{ |item| item.href }}">
<RelatedLink item="{{ item.clone() }}"></RelatedLink>
</ForEach></ul>
  </section>
</template>
<template rust:component="Callout">
  <aside class="callout" data-kind="{{ state.item.get().kind }}">
    <span class="callout-icon" aria-hidden="true">{{ match state.item.get().kind { "tip" => "✓", "warning" => "!", _ => "i" } }}</span>
    <div>
      <strong class="callout-label">{{ state.item.get().label }}</strong>
      <Prose paragraphs="{{ state.item.get().body }}"></Prose>
    </div>
  </aside>
</template>
<template rust:component="Terms">
  <dl class="terms" hidden="{{ state.items.is_empty() }}"
  ><ForEach items="{{ state.items.to_vec() }}" key="{{ |term| term.id }}" item="term">
<div class="term"><dt><Spans spans="{{ term.get().term }}"></Spans></dt
><dd><Prose paragraphs="{{ term.get().text }}"></Prose></dd></div>
</ForEach></dl>
</template>
<template rust:component="MapGroup">
  <div class="map-group" data-side="{{ state.item.get().side }}">
    <h3>{{ state.item.get().title }}</h3>
    <ul class="map-cards"
    ><ForEach items="{{ state.item.get().cards.to_vec() }}" key="{{ |card| card.href }}" item="card">
<li><a class="map-card" href="{{ card.get().href }}"
  ><code>{{ card.get().name }}</code
  ><span class="map-kind" hidden="{{ card.get().kind.is_empty() }}">{{ card.get().kind }}</span
  ><span class="map-text">{{ card.get().text }}</span></a></li>
</ForEach></ul>
  </div>
</template>
<template rust:component="ApiBody">
  <div class="api-body">
    <div class="api-params" hidden="{{ state.item.get().params.is_empty() }}">
      <h3>Type parameters</h3>
      <Terms items="{{ state.item.get().params }}"></Terms>
    </div>
    <div class="member-groups"
    ><ForEach items="{{ state.item.get().groups.to_vec() }}" key="{{ |group| group.id }}" item="group">
<div class="member-group">
  <h3 hidden="{{ group.get().title.is_empty() }}">{{ group.get().title }}</h3>
  <ul class="members"
  ><ForEach items="{{ group.get().members.to_vec() }}" key="{{ |member| member.anchor }}" item="member">
<Member item="{{ member.clone() }}"></Member>
</ForEach></ul>
</div>
</ForEach></div>
    <details class="declaration" hidden="{{ state.item.get().declaration.is_empty() }}">
      <summary>Full declaration</summary>
      <Signature tokens="{{ state.item.get().declaration }}"></Signature>
    </details>
  </div>
</template>
<template rust:component="Member">
  <li class="member" id="{{ state.item.get().anchor }}">
    <div class="member-head">
      <a class="member-name" href="#{{ state.item.get().anchor }}"
        ><code>{{ state.item.get().name }}</code></a
      ><span class="member-returns" hidden="{{ state.item.get().returns.is_empty() }}"
        ><span class="sr-only">returns </span><span aria-hidden="true">→ </span
        ><code>{{ state.item.get().returns }}</code></span
      >
    </div>
    <div class="member-text"><Prose paragraphs="{{ state.item.get().text }}"></Prose></div>
    <details
      class="member-details"
      hidden="{{ state.item.get().signature.is_empty() &amp;&amp; state.item.get().details.is_empty() }}"
    >
      <summary>{{ state.item.get().details_label }}</summary>
      <Signature
        tokens="{{ state.item.get().signature }}"
        rust:if="!state.item.get().signature.is_empty()"
      ></Signature>
      <Prose paragraphs="{{ state.item.get().details }}"></Prose>
    </details>
  </li>
</template>
<template rust:component="Toc"
  ><li>
    <a href="#{{ state.item.get().id }}">{{ state.item.get().title }}</a>
  </li></template
>
<template rust:component="RelatedLink"
  ><li>
    <a
      data-fusor-link
      href="{{ state.item.get().href }}"
      target='{{ if state.item.get().href.starts_with("/docs/source/") { "_blank" } else { "_self" } }}'
      rel="noopener"
      >{{ state.item.get().label }} →</a
    >
  </li></template
>

<template rust:component="Breadcrumb"><span><span>/</span>
  <a data-fusor-link href="/docs/{{ state.item.get().href }}">{{ state.item.get().label }}</a>
</span></template>

<template rust:component="Prose">
  <div class="prose">
    <ForEach items="{{ state.paragraphs.to_vec() }}" key="{{ |item| item.id }}">
      <div class="prose-block"><If condition="{{ item.get().items.is_empty() }}"
        ><p><Spans spans="{{ item.get().spans }}"></Spans></p
        ><Else><ul><ForEach
          items="{{ item.get().items.to_vec() }}"
          key="{{ |entry| entry.id }}"
          item="entry"
        ><li><Spans spans="{{ entry.get().spans }}"></Spans></li></ForEach></ul></Else
      ></If></div>
    </ForEach>
  </div>
</template>

<template rust:component="Spans"
  ><span class="spans"><ForEach
    items="{{ state.spans.to_vec() }}"
    key="{{ |span| span.id }}"
    item="span"
  ><span><If condition="{{ span.get().code }}"><code class="inline-code">{{ span.get().text }}</code><Else><span>{{ span.get().text }}</span></Else></If></span></ForEach></span></template
>
