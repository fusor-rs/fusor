<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Build reactive web applications with ordinary HTML and native Rust. fusor documentation, guides, and examples."
    />
    <title>fusor documentation</title>
    <link rel="icon" href="/docs/favicon.svg" />
    <link rel="stylesheet" href="/docs/docs-base.css" />
    <link rel="stylesheet" href="/docs/docs.css" />
    <link rel="stylesheet" href="/docs/showcase.css" />
  </head>
  <body>
    <script
      type="text/rust"
      src="../src/app.rs"
      rust:module="crate::app"
    ></script>
    <App state="{{ App::new() }}">
      <div class="docs-app">
        <Shell
          navigation="{{ state.navigation.clone() }}"
          header="{{ Some(state.header.clone()) }}"
          sidebar="{{ Some(state.sidebar.clone()) }}"
        >
          <Router>
            <Route fallback>
              <DocRoute navigation="{{ state.navigation.clone() }}"></DocRoute>
            </Route>
          </Router>
        </Shell>
      </div>
    </App>
  </body>
</html>

<template rust:component="TopLinks">
  <div class="top-links">
    <a
      class:selected="matches!(state.navigation.active.get(), Location::Guide(_)) &amp;&amp; !state.navigation.is_reference()"
      data-fusor-link
      href="/docs/"
      on:click="state.navigation.open()"
      >Learn</a
    ><a
      class:selected="state.navigation.active.get() == Location::Custom"
      data-fusor-link
      href="/docs/showcase"
      on:click="state.navigation.open()"
      >Showcase</a
    ><a
      class:selected="state.navigation.is_reference()"
      data-fusor-link
      href="/docs/html-and-rust/attributes"
      on:click="state.navigation.open()"
      >Reference</a
    ><a href="/benchmarks/">Benchmarks <span>↗</span></a>
  </div>
</template>
<template rust:component="Explore">
  <div class="nav-group" hidden="{{ !state.matches() }}">
    <h2>Explore</h2>
    <a data-fusor-link href="/docs/showcase" on:click="state.navigation.open()"
       class:active="state.navigation.active.get() == Location::Custom">Showcase <span class="nav-new">{{ DEMOS.len() }} demos</span></a>
  </div>
</template>
<template rust:component="DocRoute">
  <div class="doc-route">
    <Article
      site="{{ &SITE }}"
      extras="{{ state.extras.clone() }}"
      rust:if="matches!(state.page, Some(Page::Guide(_)) | None)"
      index="{{ state.guide() }}"
    ></Article>
    <Gallery rust:if="matches!(state.page, Some(Page::Showcase))"></Gallery>
    <DemoPage
      rust:if="matches!(state.page, Some(Page::Demo(_)))"
      index="{{ state.demo() }}"
    ></DemoPage>
  </div>
</template>
