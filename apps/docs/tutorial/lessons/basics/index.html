<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My first bindings</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <App state="{{ App::new() }}">
    <main>
      <h1>Hello, {{ state.name.get() }}</h1>
      <label>Your name <input bind="state.name"></label>
      <button on:click="state.count.update(|n| *n += 1)">Increase</button>
      <button disabled="{{ state.count.get() == 0 }}"
              on:click="state.count.update(|n| *n -= 1)">Decrease</button>
      <p>Count: <output>{{ state.count.get() }}</output></p>
      <button on:click='state.name.set("Grace".into())'>Use Grace</button>
    </main>
  </App>
</body>
</html>
