[package]
name = "fusor-docs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
fusor-components = { workspace = true, features = ["browser"] }
fusor-core = { workspace = true, features = ["dom", "javascript"] }
fusor-router = { workspace = true, features = ["browser"] }
fusor-async = { workspace = true, features = ["browser"] }
fusor-worker.workspace = true
futures-util = { workspace = true, features = ["std"] }
gloo-timers = { version = "=0.3.0", features = ["futures"] }
js-sys.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["KeyboardEvent", "Storage", "Navigator", "Clipboard", "Element", "MouseEvent"] }
[build-dependencies]
fusor-build.workspace = true
pulldown-cmark.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect.workspace = true
two-face.workspace = true
[dev-dependencies]
pulldown-cmark.workspace = true
syntect.workspace = true
two-face.workspace = true
[package.metadata.fusor]
entry = "web/index.html"
templates = ["web/components", "web/demos"]
assets = "public"
base-path = "/docs/"
history-fallback = ["/"]
[package.metadata.fusor.components]
article = "web/article.html"
code = "web/code.html"
showcase = "web/showcase.html"
reactive = "web/demos/reactive.html"
keyed = "web/demos/keyed.html"
lifecycle = "web/demos/lifecycle.html"
loading = "web/demos/loading.html"
coherent = "web/demos/coherent.html"
comparison = "web/demos/comparison.html"
context = "web/demos/context.html"
