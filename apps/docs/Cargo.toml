[package]
name = "fusor-docs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
docs-base = { git = "https://github.com/fusor-rs/docs-base", rev = "78990c2b07d510abc76224e82ca933f89f423850" }
fusor-components = { workspace = true, features = ["browser"] }
fusor-core = { workspace = true, features = ["dom", "javascript"] }
fusor-router = { workspace = true, features = ["browser"] }
fusor-async = { workspace = true, features = ["browser"] }
fusor-worker.workspace = true
futures-util = { workspace = true, features = ["std"] }
gloo-timers = { version = "=0.3.0", features = ["futures"] }
js-sys.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Navigator", "Clipboard", "Element", "MouseEvent"] }
[build-dependencies]
docs-base-build = { git = "https://github.com/fusor-rs/docs-base", rev = "78990c2b07d510abc76224e82ca933f89f423850" }
fusor-build.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[package.metadata.fusor]
entry = "web/index.html"
templates = ["web/components", "web/demos"]
base-path = "/docs/"
history-fallback = ["/"]
# The .txt suffix makes browsers display published source instead of running it.
[package.metadata.fusor.assets]
"/" = "public"
"/source/catalog-types.rs.txt" = "../../examples/islands/types/src/lib.rs"
"/source/catalog-site.rs.txt" = "../../examples/islands/site/src/main.rs"
"/source/catalog-site.toml.txt" = "../../examples/islands/site/Cargo.toml"
"/source/catalog-views.rs.txt" = "../../examples/islands/views/src/lib.rs"
"/source/catalog-views.html.txt" = "../../examples/islands/views/web/cart.html"
"/source/navigation-pages.rs.txt" = "../../examples/navigation/src/pages.rs"
"/source/navigation-pages.html.txt" = "../../examples/navigation/web/pages.html"
"/source/tutorial-app.rs.txt" = "tutorial/src/app.rs"
"/source/tutorial-index.html.txt" = "tutorial/web/index.html"
"/source/tutorial-Cargo.toml.txt" = "tutorial/Cargo.toml"
"/source/tutorial-lib.rs.txt" = "tutorial/src/lib.rs"
"/source/showcase-package.json.txt" = "package.json"
"/source/showcase.css.txt" = "public/showcase.css"
"/source/island-browser.rs.txt" = "../../crates/fusor-islands/src/browser.rs"
"/source/showcase/" = { files = ["src/demos/*.rs", "web/demos/*.html", "web/demos/*.js"], suffix = ".txt" }
[package.metadata.fusor.components]
article = "web/article.html"
code = "web/code.html"
showcase = "web/showcase.html"
reactive = "web/demos/reactive.html"
keyed = "web/demos/keyed.html"
lifecycle = "web/demos/lifecycle.html"
loading = "web/demos/loading.html"
coherent = "web/demos/coherent.html"
comparison = "web/demos/comparison.html"
context = "web/demos/context.html"
