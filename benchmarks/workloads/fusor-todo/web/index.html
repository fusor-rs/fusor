<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo · fusor</title></head><body><script type="text/rust" src="../src/lib.rs" rust:module="crate"></script>
<App state="{{ App::new() }}">
  <main><h1>Tasks</h1><form on:submit="{ event.prevent_default(); state.model.add(); }"><input aria-label="New task" bind="state.model.title"><button>Add task</button></form><nav><button on:click='state.model.filter.set("all".into())'>all</button><button on:click='state.model.filter.set("active".into())'>active</button><button on:click='state.model.filter.set("done".into())'>done</button></nav><p class="task-count">{{ state.model.tasks.get().len() }} tasks · {{ state.model.done() }} done</p><ul><ForEach items="{{ state.model.visible() }}" key="{{ |item| item.id }}">
  <Row item="{{ item.clone() }}" model="{{ state.model.clone() }}"></Row>
  </ForEach></ul></main>
</App>
<template rust:component="Row"><li><label><input type="checkbox" bind="state.item.get().done"><span>{{ state.item.get().title }}</span></label><button aria-label="Delete task" on:click="state.model.tasks.update(|tasks| tasks.retain(|task| task.id != state.item.get().id))">×</button></li></template></body></html>
