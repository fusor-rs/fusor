[package]
name = "fusor-bench-workload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
fusor-components.workspace = true
fusor-core = { workspace = true, features = ["islands"] }
fusor-islands.workspace = true
wasm-bindgen.workspace = true
web-sys.workspace = true
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fusor-server.workspace = true
[build-dependencies]
fusor-build.workspace = true
[package.metadata.fusor]
entry = "web/index.html"
assets = { "/" = "public" }
base-path = "/workloads/fusor/"
