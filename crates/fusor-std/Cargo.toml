[package]
name = "fusor-std"
description = "Typed forms and save actions for fusor, with one import for its optional crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["fusor", "forms", "wasm", "web", "reactive"]
categories = ["wasm", "web-programming", "gui"]

[features]
default = []
forms = []
actions = ["dep:futures-util", "dep:fusor-async"]
resources = ["dep:fusor-async"]
query = ["dep:fusor-query", "resources"]
routing = ["dep:fusor-router"]
browser = ["fusor-core/dom", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "fusor-async?/browser", "fusor-query?/browser", "fusor-router?/browser"]

[dependencies]
fusor-core.workspace = true
fusor-async = { workspace = true, optional = true }
fusor-query = { workspace = true, optional = true }
fusor-router = { workspace = true, optional = true }
futures-util = { workspace = true, features = ["std"], optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[dev-dependencies]
fusor-test.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
