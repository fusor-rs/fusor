[package]
name = "fusor-worker"
description = "Owned background tasks and worker services for fusor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fusor-core.workspace = true
fusor-async = { workspace = true, features = ["browser"] }
fusor-worker-macros.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-core = "0.3"
futures-channel.workspace = true
futures-util = { workspace = true, features = ["std"] }
inventory = "=0.3.24"
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies]
rayon = "=1.11.0"
wasm-bindgen-rayon = { version = "=1.3.0", features = ["no-bundler"] }

[dev-dependencies]
futures-executor.workspace = true

[lints]
workspace = true
