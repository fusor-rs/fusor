[package]
name = "fusor-cli"
default-run = "fusor"
description = "The fusor command-line tool: create, develop, build and preview fusor applications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["wasm", "web", "cli", "html", "reactive"]
categories = ["command-line-utilities", "development-tools", "wasm"]

[[bin]]
name = "fusor"
path = "src/main.rs"
doc = false

[dependencies]
fusor-npm.workspace = true
fusor-build.workspace = true
fusor-islands.workspace = true
html5gum = { version = "=0.8.4", default-features = false }
clap = { version = "=4.5.53", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=0.8.23"
toml_edit = "=0.22.27"
semver = "=1.0.28"
glob = "=0.3.3"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
sha2 = "=0.10.9"
flate2 = "=1.1.10"
tar = "=0.4.46"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["net", "rt", "time"] }
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }

[lints]
workspace = true
